<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GARO G Scroll</title>
  <style>
    :root {
      --garo-red: #c92333;
      --bg: #f4f4f1;
      --text: #171717;
      --muted: #666;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .hero {
      position: relative;
      height: 500vh;
    }

    .sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .topbar {
      width: min(1200px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      align-self: start;
      padding-top: 4px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--garo-red);
    }

    .hint {
      font-size: 14px;
      color: var(--muted);
    }

    .canvas-wrap {
      width: min(78vw, 78vh, 680px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bottom {
      align-self: end;
      text-align: center;
      padding-bottom: 12px;
    }

    .progress-wrap {
      width: min(240px, 70vw);
      height: 4px;
      background: rgba(0,0,0,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 0 auto 10px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--garo-red);
      transform-origin: left center;
    }

    .frame-label {
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .topbar {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }

      .canvas-wrap {
        width: min(88vw, 88vh);
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="scrollSection">
    <div class="sticky">
      <div class="topbar">
        <div class="brand">GARO</div>
        <div class="hint">Scrolla ned eller upp för att rotera G:et</div>
      </div>

      <div class="canvas-wrap">
        <canvas id="sequenceCanvas" width="500" height="500" aria-label="Roterande GARO G"></canvas>
      </div>

      <div class="bottom">
        <div class="progress-wrap">
          <div class="progress" id="progressBar"></div>
        </div>
        <div class="frame-label" id="frameLabel">Frame 1 / 25</div>
      </div>
    </div>
  </section>

  <script>
    const framePaths = ['G_0001.png', 'G_0002.png', 'G_0003.png', 'G_0004.png', 'G_0005.png', 'G_0006.png', 'G_0007.png', 'G_0008.png', 'G_0009.png', 'G_0010.png', 'G_0011.png', 'G_0012.png', 'G_0013.png', 'G_0014.png', 'G_0015.png', 'G_0016.png', 'G_0017.png', 'G_0018.png', 'G_0019.png', 'G_0020.png', 'G_0021.png', 'G_0022.png', 'G_0023.png', 'G_0024.png', 'G_0025.png'].map(name => `frames/${name}`);
    const canvas = document.getElementById("sequenceCanvas");
    const ctx = canvas.getContext("2d");
    const progressBar = document.getElementById("progressBar");
    const frameLabel = document.getElementById("frameLabel");
    const scrollSection = document.getElementById("scrollSection");

    const images = [];
    let loadedCount = 0;
    let currentFrame = 0;

    function loadImages() {
      return Promise.all(framePaths.map((src, index) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            images[index] = img;
            loadedCount++;
            resolve(img);
          };
          img.onerror = reject;
          img.src = src;
        });
      }));
    }

    function drawFrame(index) {
      const img = images[index];
      if (!img) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Keep transparent background intact
      const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
      const drawWidth = img.width * scale;
      const drawHeight = img.height * scale;
      const x = (canvas.width - drawWidth) / 2;
      const y = (canvas.height - drawHeight) / 2;

      ctx.drawImage(img, x, y, drawWidth, drawHeight);

      currentFrame = index;
      progressBar.style.width = `${(index / (images.length - 1)) * 100}%`;
      frameLabel.textContent = `Frame ${index + 1} / ${images.length}`;
    }

    function updateFromScroll() {
      const rect = scrollSection.getBoundingClientRect();
      const totalScrollable = scrollSection.offsetHeight - window.innerHeight;
      const pixelsScrolled = Math.min(Math.max(-rect.top, 0), totalScrollable);
      const progress = totalScrollable > 0 ? pixelsScrolled / totalScrollable : 0;
      const frameIndex = Math.min(
        images.length - 1,
        Math.max(0, Math.round(progress * (images.length - 1)))
      );

      if (frameIndex !== currentFrame) {
        drawFrame(frameIndex);
      } else {
        progressBar.style.width = `${progress * 100}%`;
      }
    }

    function setCanvasResolution() {
      const ratio = window.devicePixelRatio || 1;
      const displaySize = canvas.getBoundingClientRect().width;
      const size = Math.max(500, Math.round(displaySize * ratio));
      canvas.width = size;
      canvas.height = size;
      drawFrame(currentFrame);
    }

    loadImages().then(() => {
      drawFrame(0);
      setCanvasResolution();
      updateFromScroll();

      window.addEventListener("scroll", updateFromScroll, { passive: true });
      window.addEventListener("resize", () => {
        setCanvasResolution();
        updateFromScroll();
      });
    }).catch(err => {
      console.error("Kunde inte ladda bildsekvensen", err);
      frameLabel.textContent = "Kunde inte ladda frames";
    });
  </script>
</body>
</html>
